---
name: Ansible Test
on:
  pull_request_target:
    types: [opened, synchronize]

  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Integration test targets to run (space-separated, e.g. "win_scom_alert win_scom_alert_info").
          Leave empty to run ALL targets.
        required: false
        default: ""

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Approve protected environment once instead of once per job in the matrix.
  # detect-changes depends on this so no PR code runs before a maintainer approves.
  approve:
    name: Approve Integration
    runs-on: ubuntu-latest
    environment:
      name: integration-test
    steps:
      - run: echo "Deployment approved"

  # Determine which integration test targets need to run based on changed files.
  # Runs after approve so the checked-out PR code (allow-unsafe-pr-checkout) is
  # only reached once a maintainer has reviewed and approved the run.
  # The target-detection logic is inlined (not delegated to a PR script) so
  # pull_request_target never executes untrusted code from the PR in a privileged context.
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    needs: [approve]
    outputs:
      cli_args: ${{ steps.targets.outputs.cli_args }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Determine integration test targets
        id: targets
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger → use provided targets or fall back to ALL
            if [[ -n "${{ github.event.inputs.targets }}" ]]; then
              TARGETS="${{ github.event.inputs.targets }}"
            else
              TARGETS="ALL"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Push to main/stable-* → always run ALL tests as safety net
            TARGETS="ALL"
          else
            # pull_request_target → selective based on changed files
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch origin "${BASE_SHA}" 2>/dev/null || true
            git fetch origin "${HEAD_SHA}" 2>/dev/null || true
            CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            echo "Changed files:"
            echo "${CHANGED:-  (none)}"

            # ---------------------------------------------------------------
            # Inlined target-detection logic (was: scripts/get_integration_targets.sh)
            #
            # Mapping rules:
            #   plugins/modules/<name>.ps1|.yml      → win_scom_<name>
            #   plugins/modules/<name>_info.ps1|.yml → win_scom_<name>  (strip _info)
            #   plugins/module_utils/*               → ALL win_scom_* targets
            #   tests/integration/targets/win_scom_* → win_scom_<name>
            # ---------------------------------------------------------------
            MODULES_DIR="plugins/modules"
            MODULE_UTILS_DIR="plugins/module_utils"
            INTEGRATION_DIR="tests/integration/targets"
            targets=""
            run_all=false

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              # Any module_utils change → run ALL integration tests
              if [[ "$file" == "${MODULE_UTILS_DIR}/"* ]]; then
                run_all=true
                break
              fi

              # Module source file changed (.ps1 or .yml)
              if [[ "$file" == "${MODULES_DIR}/"*.ps1 || "$file" == "${MODULES_DIR}/"*.yml ]]; then
                filename=$(basename "$file")
                module_name="${filename%.*}"       # strip extension
                base_name="${module_name%_info}"   # strip _info suffix
                target="win_scom_${base_name}"
                if [[ -d "${INTEGRATION_DIR}/${target}" ]] && \
                   [[ " ${targets} " != *" ${target} "* ]]; then
                  targets="${targets:+${targets} }${target}"
                fi
                continue
              fi

              # Integration test file changed directly
              if [[ "$file" == "${INTEGRATION_DIR}/win_scom_"* ]]; then
                rel="${file#"${INTEGRATION_DIR}/"}"
                target="${rel%%/*}"
                if [[ -d "${INTEGRATION_DIR}/${target}" ]] && \
                   [[ " ${targets} " != *" ${target} "* ]]; then
                  targets="${targets:+${targets} }${target}"
                fi
                continue
              fi

            done <<< "${CHANGED}"

            if [[ "$run_all" == "true" ]]; then
              TARGETS="ALL"
            else
              TARGETS="${targets}"
            fi
          fi

          echo "Integration targets: ${TARGETS:-none}"

          if [[ "${TARGETS}" == "ALL" ]]; then
            # module_utils changed → run all tests, no target filter
            echo "cli_args=" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${TARGETS// /}" ]]; then
            # Specific targets changed
            echo "cli_args=${TARGETS}" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            # No relevant files changed → skip integration entirely
            echo "cli_args=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    runs-on: ubuntu-latest
    needs:
      - approve
      - detect-changes
    # Skip entirely when no relevant files changed
    if: >-
      always() &&
      needs.approve.result == 'success' &&
      needs.detect-changes.outputs.has_targets == 'true'
    name: I (Ⓐ${{ matrix.ansible }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - ansible: devel
            python: 3.13
          - ansible: stable-2.16
            python: 3.12
          - ansible: stable-2.17
            python: 3.12
          - ansible: stable-2.18
            python: 3.12
          - ansible: stable-2.19
            python: 3.12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - name: Show which targets would run
        env:
          TARGETS: ${{ needs.detect-changes.outputs.cli_args }}
        run: |
          echo "=================================================="
          echo "Ansible ${{ matrix.ansible }} — target detection result: '${TARGETS}'"
          echo "=================================================="

          if [[ -z "${TARGETS}" ]]; then
            echo "A module_utils file changed — ALL integration targets would run:"
            for target in tests/integration/targets/win_scom_*/; do
              echo "  • $(basename "${target}")"
            done
          else
            echo "Selected targets:"
            for target in ${TARGETS}; do
              echo "  • ${target}"
            done
          fi

      - name: Run dummy integration tests
        env:
          TARGETS: ${{ needs.detect-changes.outputs.cli_args }}
        run: |
          if [[ -z "${TARGETS}" ]]; then
            target_list=$(ls -d tests/integration/targets/win_scom_*/ | xargs -n1 basename)
          else
            target_list="${TARGETS}"
          fi

          echo ""
          echo "=== Simulating ansible-test windows-integration ==="
          for target in ${target_list}; do
            if [[ -f "tests/integration/targets/${target}/tasks/main.yml" ]]; then
              echo ""
              echo "--- Running target: ${target} ---"
              grep -E 'msg:' "tests/integration/targets/${target}/tasks/main.yml" \
                | sed 's/.*msg: */  [debug] /'
            else
              echo "WARNING: target ${target} has no tasks/main.yml — skipped."
            fi
          done

          echo ""
          echo "=== All selected targets completed successfully ==="

  check: # This job does nothing and is only used for the branch protection
    # or multi-stage CI jobs, like making sure that all tests pass before
    # a publishing job is started.
    if: always()

    needs:
      - integration

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          # Allow integration to be skipped when no relevant files changed
          allowed-skips: integration
          jobs: ${{ toJSON(needs) }}
